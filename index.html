<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Tageswissen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000'/%3E%3Cpath d='M16 3a13 13 0 0 1 0 26z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261106b">
</head>
<body>
  <div class="ambiente" id="ambiente" aria-hidden="true"></div>
  <div class="seite">

    <!-- Linke Spalte: der Tag -->
    <aside class="tag" aria-label="Der Tag">
      <div class="uhr zahl" id="uhr">--:--</div>
      <div class="datum" id="datum">&nbsp;</div>

      <div class="mond" id="mond"></div>

      <dl class="tagwerte">
        <div><dt>Wetter</dt><dd id="wetter">–</dd></div>
        <div><dt>Sonne</dt><dd id="sonne">–</dd></div>
        <div><dt>Schule</dt><dd id="ferien">–</dd></div>
      </dl>

      <div class="vorschau" id="vorschau"></div>

      <div class="heute" id="heute"></div>

      <div class="stand" id="stand">Lädt …</div>
    </aside>

    <!-- Mitte: Nachrichten -->
    <main class="mitte">
      <a class="eil" id="eil" target="_blank" rel="noopener">
        <span class="punkt"></span>
        <span class="eil-wort">Eilmeldung</span>
        <span class="titel" id="eil-titel"></span>
        <span class="wann" id="eil-wann"></span>
      </a>

      <section class="top" id="k-top"><div class="platzhalter"><i></i><i></i></div></section>

      <div class="spalten">
        <section class="spalte" id="k-wiss"><h2>Wissenschaft</h2><div class="platzhalter"><i></i><i></i><i></i></div></section>
        <section class="spalte" id="k-news"><h2>Nachrichten</h2><div class="platzhalter"><i></i><i></i><i></i></div></section>
      </div>
    </main>

    <!-- Rechts: Unterricht und Raumfahrt -->
    <aside class="rechts">
      <section class="unterricht" id="k-unt"><div class="platzhalter"><i></i><i></i><i></i></div></section>
      <section class="start" id="k-start"><div class="platzhalter"><i></i><i></i></div></section>
    </aside>
  </div>

  <script src="js/config.js?v=20261106b"></script>
  <script src="js/werkzeuge.js?v=20261106b"></script>
  <script src="js/quellen.js?v=20261106b"></script>
  <script src="js/unterricht.js?v=20261106b"></script>
  <script src="js/app.js?v=20261106b"></script>
</body>
</html>
